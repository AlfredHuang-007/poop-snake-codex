<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fff1b8">
  <meta name="description" content="一款会留下便便轨迹的爆笑贪吃蛇小游戏，支持键盘与触屏操作。">
  <title>便便蛇大作战 💩</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffe062'/%3E%3Ctext x='8' y='50' font-size='48'%3E%F0%9F%92%A9%3C/text%3E%3C/svg%3E">
  <style>
    :root{--ink:#382410;--brown:#7a421c;--cream:#fff9dc;--yellow:#ffd83d;--orange:#ff9f1c;--green:#83c341;--shadow:#5b3218;--cell:24px}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;overscroll-behavior:none}
    body{font-family:"Arial Rounded MT Bold","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:#fff1b8;background-image:radial-gradient(#e8c86b 1.4px,transparent 1.4px);background-size:20px 20px;display:grid;place-items:center;padding:18px;min-height:100dvh}
    button{font:inherit;color:inherit}
    .shell{width:min(100%,920px);display:grid;grid-template-columns:minmax(300px,1fr) 260px;gap:18px;align-items:start}
    .game-card,.side-card{background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--shadow)}
    .game-card{padding:14px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 4px 12px}
    h1{font-size:clamp(1.35rem,4vw,2rem);margin:0;letter-spacing:-.04em;white-space:nowrap}
    .scorebox{display:flex;gap:7px;align-items:center;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:7px 12px;font-weight:900;min-width:110px;justify-content:center}
    .stage{position:relative;width:100%;aspect-ratio:1/1;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#d9f29d;touch-action:none}
    canvas{display:block;width:100%;height:100%;image-rendering:auto}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:rgba(255,249,220,.83);backdrop-filter:blur(4px);transition:.2s}
    .overlay[hidden]{display:none}
    .panel{text-align:center;max-width:330px;animation:pop .35s cubic-bezier(.2,1.6,.5,1)}
    .hero-poop{font-size:5.4rem;line-height:1;filter:drop-shadow(0 5px 0 #d38a19);display:inline-block;animation:wiggle 1.8s infinite}
    .panel h2{font-size:clamp(1.7rem,6vw,2.5rem);margin:8px 0 6px;line-height:1}
    .panel p{font-size:1rem;line-height:1.55;margin:0 0 16px}
    .primary{border:3px solid var(--ink);border-radius:16px;background:var(--orange);padding:12px 20px;font-weight:900;font-size:1.05rem;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:.12s}
    .primary:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
    .primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
    .side{display:grid;gap:16px}
    .side-card{padding:18px}
    .side-card h2{font-size:1.05rem;margin:0 0 10px}
    .side-card p{margin:0;line-height:1.55;font-size:.95rem}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{border:3px solid var(--ink);border-radius:16px;padding:11px;text-align:center;background:#fff}
    .stat span{display:block;font-size:.78rem;font-weight:800;opacity:.72}
    .stat strong{font-size:1.35rem}
    .legend{display:grid;gap:10px}
    .legend div{display:flex;gap:9px;align-items:center}
    .legend b{font-size:1.4rem;width:30px;text-align:center}
    .dpad{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:7px;justify-content:center;margin-top:14px}
    .dpad button{border:3px solid var(--ink);background:#fff;border-radius:15px;font-size:1.45rem;font-weight:900;box-shadow:0 4px 0 var(--ink);touch-action:manipulation}
    .dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--yellow)}
    .up{grid-column:2}.left{grid-row:2;grid-column:1}.down{grid-row:2;grid-column:2}.right{grid-row:2;grid-column:3}
    .tip{font-size:.82rem;text-align:center;margin:12px 0 0;opacity:.72}
    @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    @media(max-width:720px){body{padding:10px;display:block}.shell{grid-template-columns:1fr;gap:12px;max-width:560px;margin:auto}.game-card{padding:10px;border-radius:22px;box-shadow:5px 5px 0 var(--shadow)}.side{grid-template-columns:1fr 1fr}.side-card{border-radius:20px;box-shadow:5px 5px 0 var(--shadow);padding:14px}.howto{display:none}.dpad{display:grid}.stage{border-radius:15px}.topbar{padding-bottom:8px}}
    @media(max-width:430px){body{padding:7px}.game-card{border-width:3px}.stage{border-width:3px}.side{grid-template-columns:1fr}.legend-card{display:none}.dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px)}h1{font-size:1.28rem}.scorebox{min-width:92px;padding:6px 9px}.side-card{padding:10px}.stats{gap:7px}.stat{padding:7px}.tip{margin-top:9px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="game-card" aria-label="便便蛇游戏">
      <div class="topbar"><h1>💩 便便蛇大作战</h1><div class="scorebox">得分 <span id="score">0</span></div></div>
      <div class="stage" id="stage">
        <canvas id="game" width="600" height="600" aria-label="游戏区域"></canvas>
        <div class="overlay" id="overlay">
          <div class="panel"><div class="hero-poop" id="hero">💩</div><h2 id="overlayTitle">准备开拉！</h2><p id="overlayText">吃掉零食，身体变长，身后还会留下香喷喷的……轨迹。</p><button class="primary" id="startBtn">开始游戏</button></div>
        </div>
      </div>
      <div class="dpad" aria-label="方向按钮">
        <button class="up" data-dir="up" aria-label="向上">↑</button><button class="left" data-dir="left" aria-label="向左">←</button><button class="down" data-dir="down" aria-label="向下">↓</button><button class="right" data-dir="right" aria-label="向右">→</button>
      </div>
      <p class="tip">键盘：方向键 / WASD　·　手机：滑动游戏区或点击方向键</p>
    </section>
    <aside class="side">
      <section class="side-card"><div class="stats"><div class="stat"><span>最高分</span><strong id="best">0</strong></div><div class="stat"><span>速度</span><strong id="speed">1×</strong></div></div></section>
      <section class="side-card legend-card"><h2>今日菜单</h2><div class="legend"><div><b>🍕</b><span>披萨：+10 分</span></div><div><b>🍩</b><span>甜甜圈：+10 分</span></div><div><b>🍔</b><span>汉堡：+10 分</span></div><div><b>💩</b><span>轨迹：千万别撞！</span></div></div></section>
      <section class="side-card howto"><h2>排便守则</h2><p>吃得越多，跑得越快。撞墙或撞到自己的身体，就会当场“社死”。</p></section>
    </aside>
  </main>
  <script>
    (()=>{
      const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
      const overlay=document.getElementById('overlay'),title=document.getElementById('overlayTitle'),copy=document.getElementById('overlayText'),hero=document.getElementById('hero');
      const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),speedEl=document.getElementById('speed'),startBtn=document.getElementById('startBtn'),stage=document.getElementById('stage');
      const GRID=20,foods=['🍕','🍩','🍔','🌮','🧁']; let snake,dir,nextDir,food,score,best=Number(localStorage.getItem('poopSnakeBest')||0),timer,running=false,touchStart=null;
      bestEl.textContent=best;
      function resize(){const size=Math.max(280,Math.floor(stage.getBoundingClientRect().width));const dpr=Math.min(devicePixelRatio||1,2);canvas.width=size*dpr;canvas.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw(size)}
      function newFood(){let p;do{p={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID),icon:foods[Math.floor(Math.random()*foods.length)]}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
      function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;food=newFood();updateStats();draw()}
      function interval(){return Math.max(70,155-Math.floor(score/40)*12)}
      function updateStats(){scoreEl.textContent=score;const level=1+Math.floor(score/40);speedEl.textContent=level+'×';if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('poopSnakeBest',best)}}
      function start(){clearTimeout(timer);reset();running=true;overlay.hidden=true;tick()}
      function end(){running=false;clearTimeout(timer);hero.textContent=score>=best&&score>0?'🏆':'💩';title.textContent='噗——撞上了！';copy.textContent=`本局 ${score} 分。${score>=80?'这条蛇肠胃惊人！':'再来一局，拉出更长的传奇。'}`;startBtn.textContent='再拉一次';overlay.hidden=false;draw()}
      function tick(){if(!running)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){end();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;food=newFood();updateStats()}else snake.pop();draw();timer=setTimeout(tick,interval())}
      function setDir(x,y){if(!running)return;if(x===-dir.x&&y===-dir.y)return;nextDir={x,y}}
      function draw(forceSize){const size=forceSize||stage.getBoundingClientRect().width;if(!snake||!size)return;ctx.clearRect(0,0,size,size);const c=size/GRID;ctx.fillStyle='#d9f29d';ctx.fillRect(0,0,size,size);ctx.strokeStyle='rgba(56,36,16,.07)';ctx.lineWidth=1;for(let i=1;i<GRID;i++){ctx.beginPath();ctx.moveTo(i*c,0);ctx.lineTo(i*c,size);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*c);ctx.lineTo(size,i*c);ctx.stroke()}
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${c*.76}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;ctx.fillText(food.icon,(food.x+.5)*c,(food.y+.53)*c);
        for(let i=snake.length-1;i>=0;i--){const s=snake[i];if(i===0){ctx.fillStyle='#70b52f';roundRect(s.x*c+2,s.y*c+2,c-4,c-4,c*.28);ctx.fill();const eyeY=(s.y+.38)*c;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((s.x+.35)*c,eyeY,c*.12,0,Math.PI*2);ctx.arc((s.x+.66)*c,eyeY,c*.12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#25160b';ctx.beginPath();ctx.arc((s.x+.37)*c,eyeY,c*.055,0,Math.PI*2);ctx.arc((s.x+.68)*c,eyeY,c*.055,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e84d5b';ctx.beginPath();ctx.arc((s.x+.52)*c,(s.y+.7)*c,c*.08,0,Math.PI);ctx.fill()}else{ctx.font=`${c*.7}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;ctx.fillText('💩',(s.x+.5)*c,(s.y+.53)*c)}}
      }
      function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}
      const keys={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
      addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();setDir(...keys[e.key])}else if((e.key===' '||e.key==='Enter')&&!running){e.preventDefault();start()}});
      document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};setDir(...m[b.dataset.dir])}));
      stage.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY}});stage.addEventListener('pointerup',e=>{if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy))});
      startBtn.addEventListener('click',start);addEventListener('resize',resize,{passive:true});reset();requestAnimationFrame(resize);
      window.poopSnake={start,move:(direction)=>{const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};if(m[direction])setDir(...m[direction])},state:()=>({running,score,best,speed:1+Math.floor(score/40)})};
      const mc=document.modelContext;
      if(mc?.registerTool){
        const register=(tool)=>{try{Promise.resolve(mc.registerTool(tool)).catch(()=>{})}catch{}};
        register({name:'start_poop_snake_game',title:'开始便便蛇游戏',description:'开始或重新开始一局便便蛇游戏，并重置本局分数。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{start();return window.poopSnake.state()}});
        register({name:'move_poop_snake',title:'控制便便蛇方向',description:'让正在游戏中的便便蛇向上、下、左或右移动。',inputSchema:{type:'object',properties:{direction:{type:'string',enum:['up','down','left','right']}},required:['direction'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:(input)=>{if(!input||!['up','down','left','right'].includes(input.direction))throw new Error('方向必须是 up、down、left 或 right');if(!running)throw new Error('游戏尚未开始');window.poopSnake.move(input.direction);return window.poopSnake.state()}});
        register({name:'read_poop_snake_state',title:'查看便便蛇状态',description:'读取当前游戏是否进行中、本局得分、最高分与速度等级。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>window.poopSnake.state()});
      }
    })();
  </script>
</body>
</html>
